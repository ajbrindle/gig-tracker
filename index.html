<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigTracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border border-gray-200 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">GigTracker</h1>
                <p class="text-sm text-gray-500 mt-1">Manchester & Stockport Area</p>
            </div>
            
            <!-- The Two Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                <button id="sync-btn" class="bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-semibold py-2 px-4 rounded-lg shadow-sm transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50">
                    Force Sync (2 mins)
                </button>
                <button id="load-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50">
                    Load Unseen Gigs
                </button>
            </div>
        </header>

        <!-- Status Message / Loading -->
        <div id="status-message" class="hidden text-center py-4 mb-4 font-medium rounded-lg">
            <!-- Text injected via JS -->
        </div>

        <!-- Action Bar (Hidden by default) -->
        <div id="action-bar" class="hidden flex justify-end mb-4">
            <button id="dismiss-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-1 px-4 rounded transition-colors text-sm">
                Dismiss All (Mark as Seen)
            </button>
        </div>

        <!-- Gigs Container -->
        <div id="gigs-container" class="space-y-6">            <div class="text-center text-gray-400 py-12 border-2 border-dashed border-gray-300 rounded-xl">
                Click "Load Unseen Gigs" to check the database.
            </div>
        </div>
    </div>

    <!-- The Logic -->
    <script>
        const CLOUD_FUNCTION_URL = 'CLOUD_FUNCTION_URL'; // <-- PASTE YOUR URL HERE

        const loadBtn = document.getElementById('load-btn');
        const syncBtn = document.getElementById('sync-btn');
        const statusMsg = document.getElementById('status-message');
        const gigsContainer = document.getElementById('gigs-container');
        const dismissBtn = document.getElementById('dismiss-btn');
        const actionBar = document.getElementById('action-bar');

        // Helper function to manage UI state
        function setUIState(isLoading, message, isWarning = false) {
            loadBtn.disabled = isLoading;
            syncBtn.disabled = isLoading;
            
            if (isLoading) {
                loadBtn.classList.add('opacity-50', 'cursor-not-allowed');
                syncBtn.classList.add('opacity-50', 'cursor-not-allowed');
                statusMsg.classList.remove('hidden', 'bg-green-100', 'text-green-800');
                
                if (isWarning) {
                    statusMsg.classList.add('bg-amber-100', 'text-amber-800', 'animate-pulse');
                } else {
                    statusMsg.classList.add('bg-blue-100', 'text-blue-800', 'animate-pulse');
                }
                statusMsg.textContent = message;
            } else {
                loadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                syncBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                statusMsg.classList.add('hidden');
                statusMsg.className = "hidden text-center py-4 mb-4 font-medium rounded-lg"; // reset classes
            }
        }

        // ==========================================
        // ACTION 1: READ ONLY (Instantly loads data)
        // ==========================================
        loadBtn.addEventListener('click', async () => {
            setUIState(true, "Fetching gigs from database...");
            gigsContainer.innerHTML = '';

            try {
                const response = await fetch(CLOUD_FUNCTION_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                renderGigs(data.newGigs || {});

            } catch (error) {
                console.error("Error fetching gigs:", error);
                gigsContainer.innerHTML = `<div class="text-red-500 text-center py-4 bg-red-50 rounded-lg border border-red-200">Failed to load gigs. Check console for details.</div>`;
            } finally {
                setUIState(false);
            }
        });

        // ==========================================
        // ACTION 2: SYNC (Runs the 2-minute scrape)
        // ==========================================
        syncBtn.addEventListener('click', async () => {
            setUIState(true, "Scraping Songkick... This takes about 2 minutes. Please don't close this page.", true);
            gigsContainer.innerHTML = `<div class="text-center text-gray-400 py-12 border-2 border-dashed border-gray-300 rounded-xl">Sync in progress... grabbing coffee ☕</div>`;

            try {
                const response = await fetch(`${CLOUD_FUNCTION_URL}?action=sync`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const resultText = await response.text();
                console.log(resultText); // Should say "Sync complete."

                // Show success briefly, then auto-click the load button!
                statusMsg.className = "text-center py-4 mb-4 font-medium rounded-lg bg-green-100 text-green-800";
                statusMsg.textContent = "Sync complete! Loading new gigs...";
                
                setTimeout(() => {
                    loadBtn.click();
                }, 1500);

            } catch (error) {
                console.error("Error during sync:", error);
                gigsContainer.innerHTML = `<div class="text-red-500 text-center py-4 bg-red-50 rounded-lg border border-red-200">Sync failed. Check console for details.</div>`;
                setUIState(false);
            }
        });

        // Add the logic for the dismiss button
        dismissBtn.addEventListener('click', async () => {
            const confirmDismiss = confirm("Are you sure? This will clear this list until new gigs are announced.");
            if (!confirmDismiss) return;

            dismissBtn.disabled = true;
            dismissBtn.textContent = "Clearing...";

            try {
                // Call the new backend endpoint
                const response = await fetch(`${CLOUD_FUNCTION_URL}?action=markSeen`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                // Clear the UI
                renderGigs({}); 
                
            } catch (error) {
                console.error("Error clearing gigs:", error);
                alert("Failed to dismiss gigs. Try again.");
            } finally {
                dismissBtn.disabled = false;
                dismissBtn.textContent = "Dismiss All (Mark as Seen)";
            }
        });

        // ==========================================
        // RENDER LOGIC
        // ==========================================
        function renderGigs(groupedGigs) {
            const venues = Object.keys(groupedGigs);
            
            if (venues.length === 0) {
                actionBar.classList.add('hidden'); // Hide dismiss button
                gigsContainer.innerHTML = `<div class="text-center text-gray-500 py-12 bg-white rounded-xl shadow-sm border border-gray-200">No new gigs announced since your last check!</div>`;
                return;
            }

            actionBar.classList.remove('hidden'); // Show dismiss button

            venues.forEach(venueName => {
                const gigs = groupedGigs[venueName];
                const section = document.createElement('div');
                section.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden";
                
                section.innerHTML = `
                    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                        <h2 class="text-xl font-bold text-gray-800">${venueName}</h2>
                    </div>
                `;

                const ul = document.createElement('ul');
                ul.className = "divide-y divide-gray-100";

                gigs.forEach(gig => {
                    ul.innerHTML += `
                        <li class="px-6 py-5 flex flex-col sm:flex-row sm:items-center justify-between hover:bg-gray-50 transition-colors">
                            <div class="mb-4 sm:mb-0">
                                <p class="text-lg font-semibold text-gray-900">${gig.artist}</p>
                                <div class="flex items-center text-sm text-gray-500 mt-1">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${new Date(gig.date).toLocaleDateString('en-GB', { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' })}
                                </div>
                            </div>
                            <a href="${gig.ticketUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                                Full Details
                            </a>
                        </li>
                    `;
                });

                section.appendChild(ul);
                gigsContainer.appendChild(section);
            });
        }
    </script>
</body>
</html>
